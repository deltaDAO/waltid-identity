server:
  public:
    address: ":8000"
  admin:
    address: ":8001"

database:
  kind: postgres
  host: hanko-postgres
  port: 5432
  dbname: hanko
  user: hanko
  password: hanko

# IMPORTANT: replace with a securely generated 32-byte key before production use
secrets:
  keys:
    - CHANGE_ME_REPLACE_WITH_32_BYTE_SECRET_KEY

webauthn:
  relying_party:
    id: "localhost"
    display_name: "Walt.id Wallet"
    origins:
      - "http://localhost:7104"

email:
  require_verification: false

account:
  allow_deletion: false
  allow_signup: true

session:
  lifespan: "1h"

log:
  level: "info"
